[project]
name = "smartconfig"
version = "0.8.1"
description = "Add smart functionality to configuration files."
readme = "README.md"
authors = [
    { name = "Justin Eldridge", email = "eldridgejm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
pythonVersion = "3.13"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "coverage>=7.12.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "sphinx>=8.1.3",
    "sphinxawesome-theme>=5.3.2",
    "sphinxcontrib-mermaid>=1.0.0",
    "ruamel-yaml>=0.18.16",
    "mypy>=1.18.2",
    "sphinx-autobuild>=2025.8.25",
]

# Ship the documentation's .rst pages inside the package, at smartconfig/docs,
# so that tools (and AI agents) reading the installed package can find them.
# `sources` rewrites docs/source/ to smartconfig/docs/ in the wheel; the
# exclude patterns drop everything in docs/source except the .rst pages
# (conf.py, _static/). force-include can't be used here: hatchling doesn't
# apply exclude patterns to force-included paths.
[tool.hatch.build.targets.wheel]
only-include = ["src/smartconfig", "docs/source"]
exclude = ["/docs/source/*", "!/docs/source/*.rst"]
sources = { "src" = "", "docs/source" = "smartconfig/docs" }
